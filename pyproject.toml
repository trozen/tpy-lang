[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tpy-poc"
version = "0.1.0"
description = "TurboPython compiler - translates restricted Python-syntax to C++ for ultra-low-latency applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
bundled = ["ziglang>=0.13"]

[project.scripts]
tpyc = "tpyc.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["tpyc"]
exclude = ["tpyc/_build_hook.py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "tpyc/_build_hook.py"

[tool.hatch.build.targets.wheel.force-include]
"runtime" = "tpyc/_data/runtime"
"lib/tpy" = "tpyc/_data/lib/tpy"
"tpyc/_buildinfo.py" = "tpyc/_buildinfo.py"

[tool.pyright]
extraPaths = ["lib/cpy"]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests", "tpyc"]
norecursedirs = ["tests/cases", "__tpyc__"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.5",
]
