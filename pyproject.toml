[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tpy-lang"
dynamic = ["version"]
description = "TurboPython compiler - translates restricted Python-syntax to C++ for ultra-low-latency applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://tpy-lang.org"
Repository = "https://github.com/trozen/tpy-lang"

[project.optional-dependencies]
bundled = ["ziglang>=0.13"]

[project.scripts]
tpyc = "tpyc.cli:main_tpyc"
tpy = "tpyc.cli:main_tpy"

[tool.uv]
package = true

[tool.uv.workspace]
members = ["tools/pytest-hosts"]

[tool.uv.sources]
pytest-hosts = { workspace = true }

[tool.hatch.version]
source = "regex"
path = "tpyc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tpyc"]
exclude = ["tpyc/_build_hook.py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "tpyc/_build_hook.py"

[tool.hatch.build.targets.wheel.force-include]
"runtime" = "tpyc/_data/runtime"
"lib/tpy" = "tpyc/_data/lib/tpy"
"docs/TPY_FOR_AGENTS.md" = "tpyc/_data/docs/TPY_FOR_AGENTS.md"
"docs/LANGUAGE_FEATURES.md" = "tpyc/_data/docs/LANGUAGE_FEATURES.md"
"docs/STDLIB_ROADMAP.md" = "tpyc/_data/docs/STDLIB_ROADMAP.md"

# Allowlist exactly what a wheel-from-sdist build needs, so stray
# working-tree files (untracked scratch, local tool configs) can never
# leak into a published artifact. `only-include` rather than `include`:
# `include` only filters, hatchling still walks the whole tree (a tree
# with every test case built holds >100k files, and under a saturated
# full-suite run that walk has exceeded the packaging test's budget),
# while `only-include` walks just these paths. Excludes and .gitignore
# still apply within them.
[tool.hatch.build.targets.sdist]
only-include = [
    "tpyc",
    "runtime",
    "lib/tpy",
    "docs/TPY_FOR_AGENTS.md",
    "docs/LANGUAGE_FEATURES.md",
    "docs/STDLIB_ROADMAP.md",
    "README.md",
    "RELEASE_NOTES.md",
]

# The hook stamps _buildinfo.py into the sdist too, so wheel-from-sdist
# (uv build's default flow) inherits a real GIT_COMMIT instead of falling
# back to "unknown" when the temp build dir isn't a git repo.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "tpyc/_build_hook.py"

[tool.pyright]
extraPaths = ["lib/cpy"]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests", "tpyc"]
norecursedirs = ["tests/cases", "__tpyc__"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_configs = true

# Remote test hosts (tools/pytest-hosts). Active only for a developer with
# a personal hosts file naming this project; otherwise pytest is unchanged.
[tool.pytest-hosts]
setup = "uv sync -q"
setup_when = ["pyproject.toml", "uv.lock", "tools/pytest-hosts/pyproject.toml"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=9.0.2",
    "pytest-xdist>=3.5",
    "pytest-hosts",
]
